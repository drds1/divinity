version: 2.1

jobs:
  test:
    parameters:
      python:
        type: string
    docker:
      - image: cimg/python:<< parameters.python >>
    steps:
      - checkout
      - restore_cache:
          key: deps-<< parameters.python >>-{{ checksum "pyproject.toml" }}
      - run:
          name: Install
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install --upgrade pip
            pip install -e ".[dev]"
      - save_cache:
          key: deps-<< parameters.python >>-{{ checksum "pyproject.toml" }}
          paths:
            - venv
      - run:
          name: Tests
          command: |
            . venv/bin/activate
            pytest

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              python: ["3.10", "3.12"]
