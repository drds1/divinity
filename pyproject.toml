[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "divinity-forecast"
version = "0.4.0"
description = "Automatic timeseries forecasting with honest prediction intervals"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "drds1", email = "drds.gh1@gmail.com" }]
keywords = ["forecasting", "time series", "timeseries", "arima", "seasonality", "prediction intervals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pre-commit>=3",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6",
]
benchmark = [
    "prophet>=1.1",
    "statsforecast>=1.7",
    "datasetsforecast>=0.0.8",
]

[project.urls]
Homepage = "https://github.com/drds1/divinity"
Documentation = "https://github.com/drds1/divinity#readme"
Issues = "https://github.com/drds1/divinity/issues"
Changelog = "https://github.com/drds1/divinity/releases"

[tool.setuptools]
packages = ["divinity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: coverage checks over many random seeds (deselect with -m 'not slow')"]
