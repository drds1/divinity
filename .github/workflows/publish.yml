name: Publish to PyPI

# Builds the sdist and wheel and uploads them to PyPI whenever a GitHub
# release is published (Releases -> "Draft a new release", tag e.g. v0.2.0),
# or by hand from the Actions tab.
# Uses PyPI trusted publishing (OIDC), so no API token is stored anywhere.
# One-time set-up on PyPI (pypi.org -> your account -> Publishing -> add a
# pending publisher): project "divinity-forecast", owner "drds1",
# repository "divinity", workflow "publish.yml", environment "pypi".
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fast tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          MPLBACKEND=Agg pytest -m "not slow"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/divinity-forecast
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
